name: CI

# Verifica las cuatro capas en Windows y Linux (RF-28 / CA-30).
# El núcleo se compila como wheel con maturin a través de `pip install ./core_rust`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]

    env:
      # El visor y los diálogos se ejercitan sin servidor gráfico (design §6.6).
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dependencias de sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de compilación de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core_rust -> target

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Formato de Rust
        working-directory: core_rust
        run: cargo fmt --all --check

      - name: Clippy (sin warnings)
        working-directory: core_rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Pruebas de Rust (sin Python)
        working-directory: core_rust
        run: cargo test --no-default-features

      - name: Compilar la extensión nativa
        run: pip install ./core_rust

      - name: Instalar el proyecto en modo editable
        run: pip install -e .

      - name: Pruebas de Python
        run: pytest -q

      - name: Lint de Python
        run: ruff check .
