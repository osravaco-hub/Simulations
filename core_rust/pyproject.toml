# Configuración de maturin: permite `maturin develop` y `maturin build`.
# maturin compila el crate como cdylib y lo empaqueta como extensión nativa
# importable (`import core_rust`).
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "core_rust"
description = "Núcleo nativo (rigging y simulación) para Rig Studio"
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "core_rust"
# Sin `python-source`: el módulo es 100% Rust (declararlo vacío rompe `maturin develop`).
strip = true
