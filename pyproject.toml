# Manifiesto raíz de Rig Studio (setuptools; nunca compila Rust).
#
# `pip install -e .` instala SOLO los paquetes Python `app` y `py_bridge`
# (decisión D-10 del diseño). La extensión nativa se compila aparte con
# maturin o cargo y `py_bridge.native` la localiza.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-studio"
version = "0.1.0"
description = "Rig Studio: rigging automático y simulación de mallas 3D"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Por definir" }
dependencies = [
    "PySide6>=6.7,<7.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "jsonschema>=4.21",
    "ruff>=0.6",
    "maturin>=1.7,<2.0",
]

[tool.setuptools]
packages = ["app", "py_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "gui: requiere PySide6 y un servidor gráfico (offscreen es válido)",
    "native: requiere la extensión nativa core_rust compilada",
    "slow: prueba lenta, fuera del ciclo rápido",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
